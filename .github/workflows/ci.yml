name: Billiardlearning CI

on:
  push:
    branches:
      - main
      - "ai/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: billiardlearning-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-ci:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: "any"
          cache: true

      - name: Show Flutter environment
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test